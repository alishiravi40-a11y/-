<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>حسابداری الماس شهر</title>
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%231f6f5c%22/%3E%3C/svg%3E">
</head>
<body>
<header>
  <a class="brand" href="#/">حسابداری الماس شهر</a>
  <div id="search" hidden><input id="q" placeholder="جست‌وجو: شخص، کالا، شماره سند یا فاکتور، چک" autocomplete="off"><div id="results" hidden></div></div>
  <div id="loginbox" class="row">
    <label>کاربر <input id="user" size="10" autocomplete="username"></label>
    <label>رمز <input id="pass" type="password" size="12" autocomplete="current-password"></label>
    <label>کد یکبار مصرف <input id="otp" size="6" inputmode="numeric" autocomplete="one-time-code" placeholder="اگر دارید"></label>
    <button class="btn primary" id="login">ورود</button>
  </div>
  <div id="userbox" class="row" hidden><span id="who" class="muted"></span><a class="btn" href="#/pwchange">تغییر رمز</a><button class="btn" id="logout">خروج</button></div>
</header>
<div class="layout">
  <nav id="nav" aria-label="بخش‌ها"></nav>
  <main id="view"><p class="muted">نام کاربری و رمز را وارد کنید.</p></main>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
