<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>حسابداری الماس شهر</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1f2328;--muted:#5f6670;--line:#e3e3df;--accent:#1f6f5c;--high:#b42318;--medium:#b54708;--low:#475467;--ok:#067647}
@media (prefers-color-scheme:dark){:root{--bg:#141619;--card:#1c1f23;--ink:#e8e8e6;--muted:#a3a8ae;--line:#2c3036;--accent:#4fb39a;--high:#f97066;--medium:#fdb022;--low:#98a2b3;--ok:#47cd89}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 Vazirmatn,Tahoma,system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:17px;margin:0}main{max-width:1100px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit}
nav button[aria-selected=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:600}td.num{direction:ltr;text-align:left}
.sev{font-weight:700}.sev.high{color:var(--high)}.sev.medium{color:var(--medium)}.sev.low{color:var(--low)}.zero{color:var(--ok)}
label{color:var(--muted);font-size:13px}select,input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:10px}.muted{color:var(--muted)}.err{color:var(--high)}
</style>
</head>
<body>
<header>
  <h1>حسابداری رسمی الماس شهر</h1>
  <div class="row" style="margin:0"><label>کاربر <input id="user" size="12" autocomplete="username"></label><button class="btn" id="login">ورود</button></div>
</header>
<main>
  <nav role="tablist">
    <button role="tab" data-tab="inbox" aria-selected="true">کارتابل کنترل‌ها</button>
    <button role="tab" data-tab="tb" aria-selected="false">تراز چهارستونی</button>
    <button role="tab" data-tab="aging" aria-selected="false">سن‌بندی حساب اشخاص</button>
    <button role="tab" data-tab="sale" aria-selected="false">فاکتور فروش</button>
    <button role="tab" data-tab="receipt" aria-selected="false">دریافت وجه</button>
    <button role="tab" data-tab="ops" aria-selected="false">عملیات مجاز من</button>
  </nav>
  <section id="view"><p class="muted">نام کاربری را وارد کنید.</p></section>
</main>
<script>
const $ = s => document.querySelector(s);
const AREA = {sales:'فروش', receivables:'مطالبات', cheques:'چک', inventory:'موجودی', tax:'مؤدیان', beta:'اقساط بتا', ledger:'دفتر'};
const TEXT_COLS = new Set(['code', 'account_code', 'control', 'operation', 'basis', 'function_signature']);
const DATE_COLS = new Set(['oldest_open_due', 'since', 'effective_date', 'invoice_date', 'due_date']);
// dates are stored in the standard calendar and SHOWN in the Jalali calendar (browser Intl, no library)
const jdate = iso => { try { return new Date(iso + 'T12:00:00').toLocaleDateString('fa-IR-u-ca-persian', {year: 'numeric', month: '2-digit', day: '2-digit'}); } catch (e) { return iso; } };
const fmt = v => v === null || v === undefined ? '—' : (/^-?\d+(\.\d+)?$/.test(String(v)) ? Number(v).toLocaleString('fa-IR') : v);
let user = ''; try { user = sessionStorage.getItem('almas_user') || ''; } catch (e) {}
$('#user').value = user;
async function api(path, body) {
  const r = await fetch(path, {method: body ? 'POST' : 'GET', headers: {'X-Almas-User': user, 'Content-Type': 'application/json'},
                               body: body ? JSON.stringify(body) : undefined});
  const j = await r.json(); if (!r.ok) throw new Error(j.detail || r.status); return j;
}
const op = (name, args) => api('/operations/' + name, {args}).then(j => j.rows);
function table(rows, cols) {
  if (!rows.length) return '<p class="zero">موردی نیست.</p>';
  return '<table><thead><tr>' + cols.map(c => `<th>${c[1]}</th>`).join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + cols.map(c => { const v = r[c[0]]; const n = /^-?\d/.test(String(v));
      if (c[0] === 'area') return `<td>${AREA[v] || v}</td>`;
      if (TEXT_COLS.has(c[0])) return `<td>${v ?? '—'}</td>`;                     // codes are not amounts
      if (DATE_COLS.has(c[0])) return `<td>${v ? jdate(String(v).slice(0, 10)) : '—'}</td>`;
      return c[0] === 'severity' ? `<td class="sev ${v}">${{high:'زیاد',medium:'متوسط',low:'کم'}[v] || v}</td>`
                                 : `<td class="${n ? 'num' : ''}">${fmt(v)}</td>`; }).join('') + '</tr>').join('') + '</tbody></table>';
}
const today = new Date().toISOString().slice(0, 10);
const views = {
  async inbox() {
    const rows = await op('controls.inbox', {p_as_of: today});
    const open = rows.filter(r => Number(r.items) > 0), clear = rows.length - open.length;
    return `<div class="card"><p>${fmt(open.length)} کنترل نیازمند توجه · <span class="zero">${fmt(clear)} کنترل بدون مورد</span></p>` +
      table(open.sort((a, b) => ['high','medium','low'].indexOf(a.severity) - ['high','medium','low'].indexOf(b.severity)),
            [['area','حوزه'],['control','کد'],['severity','شدت'],['title','شرح'],['items','تعداد'],['amount','مبلغ (ریال)'],['basis','پشتوانه']]) + '</div>';
  },
  async tb() {
    const f = $('#tbf')?.value || '', t = $('#tbt')?.value || '', y = $('#tby')?.value || '';
    let out = `<div class="card row"><label>سال مالی <input id="tby" value="${y}" size="5"></label><label>از <input id="tbf" type="date" value="${f}"></label>
      <label>تا <input id="tbt" type="date" value="${t}"></label><button class="btn" onclick="show('tb')">نمایش</button></div>`;
    if (!y || !f || !t) return out + '<p class="muted">سال و بازه را وارد کنید.</p>';
    const rows = (await op('ledger.trial_balance', {p_year: y, p_from: f, p_to: t})).filter(r => r.party_id === null && r.level <= 2)
      .sort((a, b) => a.code.localeCompare(b.code));
    return out + '<div class="card">' + table(rows, [['code','کد'],['name','حساب'],['opening','مانده اول'],['period_debit','گردش بدهکار'],
      ['period_credit','گردش بستانکار'],['closing_debit','مانده بدهکار'],['closing_credit','مانده بستانکار']]) + '</div>';
  },
  async aging() {
    const rows = (await op('ar.aging_report', {p_as_of: today})).slice(0, 300);
    return '<div class="card">' + table(rows, [['party_name','شخص'],['account_code','حساب'],['not_due','سررسیدنشده'],['overdue_1_90','۱ تا ۹۰ روز گذشته'],
      ['overdue_over_90','بیش از ۹۰ روز'],['unapplied_credit','بستانکار تخصیص‌نیافته'],['net','خالص'],['oldest_open_due','قدیمی‌ترین سررسید']]) + '</div>';
  },
  async sale() {
    const [wh, cash] = await Promise.all([op('warehouses.list', {}), op('money_accounts.list', {})]);
    setTimeout(() => wireSale(wh), 0);
    return `<div class="card"><div class="row">
        <label>تاریخ <input id="sdate" type="date" value="${today}"></label>
        <label>مشتری <input id="sparty" list="plist" placeholder="نام، کد ملی یا موبایل" size="28"></label><datalist id="plist"></datalist></div>
      <div class="row"><label>کالا <input id="sitem" list="ilist" size="24"></label><datalist id="ilist"></datalist>
        <label>انبار <select id="swh">${wh.map(w => `<option value="${w.warehouse_id}">${w.name}</option>`).join('')}</select></label>
        <label>تعداد <input id="sqty" type="number" min="1" value="1" style="width:80px"></label>
        <label>قیمت واحد (ریال) <input id="sprice" type="number" min="0" style="width:140px"></label>
        <button class="btn" id="sadd">افزودن ردیف</button></div>
      <div id="slines"></div>
      <div class="row"><label>دریافت نقد/کارت (ریال) <input id="spaid" type="number" min="0" value="0" style="width:140px"></label>
        <label>به <select id="scash">${cash.map(a => `<option value="${a.account_id}">${a.name}</option>`).join('')}</select></label>
        <button class="btn" id="ssave" style="background:var(--accent);color:#fff">ثبت نهایی فاکتور</button></div>
      <div id="smsg"></div></div>`;
  },
  async receipt() {
    const cash = await op('money_accounts.list', {});
    setTimeout(wireReceipt, 0);
    return `<div class="card"><div class="row">
        <label>تاریخ <input id="rdate" type="date" value="${today}"></label>
        <label>از شخص <input id="rparty" list="plist" size="28"></label><datalist id="plist"></datalist>
        <label>مبلغ (ریال) <input id="ramount" type="number" min="1" style="width:160px"></label>
        <label>به <select id="rcash">${cash.map(a => `<option value="${a.account_id}">${a.name}</option>`).join('')}</select></label>
        <button class="btn" id="rsave" style="background:var(--accent);color:#fff">ثبت دریافت</button></div><div id="rmsg"></div></div>`;
  },
  async ops() {
    const rows = await api('/operations');
    return '<div class="card">' + table(rows.map(r => ({...r, permitted: r.permitted ? 'بله' : 'خیر', kind: r.kind === 'write' ? 'ثبت' : 'مشاهده'})),
      [['operation','عملیات'],['kind','نوع'],['purpose','هدف'],['permitted','مجاز'],['undo','راه برگشت'],['basis','پشتوانه']]) + '</div>';
  }
};
// ---- forms: every step is a catalogued operation; the page holds no rule of its own ----
const picked = {};
function lookup(inputId, listId, opName, key, label) {
  const inp = $('#' + inputId);
  inp.oninput = async () => {
    const q = inp.value.trim(); if (q.length < 2) return;
    const rows = await op(opName, {p_query: q});
    $('#' + listId).innerHTML = rows.map(r => `<option value="${r[label]}">`).join('');
    const hit = rows.find(r => r[label] === q); picked[inputId] = hit ? hit[key] : null;
  };
}
function wireSale() {
  const lines = [];
  lookup('sparty', 'plist', 'parties.find', 'party_id', 'name'); lookup('sitem', 'ilist', 'items.find', 'item_id', 'name');
  const draw = () => $('#slines').innerHTML = lines.length ? table(lines.map((l, i) => ({...l, n: i + 1, total: l.quantity * l.unit_price})),
      [['n','ردیف'],['name','کالا'],['quantity','تعداد'],['unit_price','قیمت واحد'],['total','جمع']]) : '';
  $('#sadd').onclick = () => {
    if (!picked.sitem) return $('#smsg').innerHTML = '<p class="err">کالا را از فهرست انتخاب کنید.</p>';
    lines.push({item_id: picked.sitem, name: $('#sitem').value, warehouse_id: Number($('#swh').value),
                quantity: Number($('#sqty').value), unit_price: Number($('#sprice').value)}); draw();
  };
  $('#ssave').onclick = async () => {
    const msg = $('#smsg');
    if (!picked.sparty || !lines.length) return msg.innerHTML = '<p class="err">مشتری و دست‌کم یک ردیف لازم است.</p>';
    try {
      const paid = Number($('#spaid').value);
      const pay = paid > 0 ? [{method: 'cash', account_id: Number($('#scash').value), amount: paid}] : [];
      const id = Object.values((await op('sales.create', {p_date: $('#sdate').value, p_party: picked.sparty,
                   p_lines: lines.map(({item_id, warehouse_id, quantity, unit_price}) => ({item_id, warehouse_id, quantity, unit_price})), p_payments: pay}))[0])[0];
      try { await op('sales.finalize', {p_invoice: id}); }
      catch (e) {
        if (!/below/.test(e.message)) throw e;
        const reason = prompt('فروش زیر قیمت خرید است. در صورت تأیید، علت را بنویسید:');
        if (!reason) throw new Error('فاکتور به‌صورت پیش‌نویس ماند (فروش زیر قیمت خرید تأیید نشد).');
        await op('sales.finalize', {p_invoice: id, p_acknowledge_below_cost: true, p_below_cost_reason: reason});
      }
      msg.innerHTML = `<p class="zero">فاکتور ${fmt(id)} ثبت نهایی شد (سند حسابداری و خروج کالا).</p>`; lines.length = 0; draw();
    } catch (e) { msg.innerHTML = `<p class="err">${e.message}</p>`; }
  };
}
function wireReceipt() {
  lookup('rparty', 'plist', 'parties.find', 'party_id', 'name');
  $('#rsave').onclick = async () => {
    const msg = $('#rmsg');
    if (!picked.rparty) return msg.innerHTML = '<p class="err">شخص را از فهرست انتخاب کنید.</p>';
    try {
      await op('treasury.receive', {p_party: picked.rparty, p_money_account: Number($('#rcash').value), p_amount: Number($('#ramount').value), p_date: $('#rdate').value});
      msg.innerHTML = '<p class="zero">دریافت ثبت شد.</p>';
    } catch (e) { msg.innerHTML = `<p class="err">${e.message}</p>`; }
  };
}
let current = 'inbox';
async function show(tab) {
  current = tab;
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  if (!user) { $('#view').innerHTML = '<p class="muted">نام کاربری را وارد کنید.</p>'; return; }
  $('#view').innerHTML = '<p class="muted">در حال بارگذاری…</p>';
  try { $('#view').innerHTML = await views[tab](); } catch (e) { $('#view').innerHTML = `<p class="err">${e.message}</p>`; }
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.tab));
// every date input shows its Jalali date next to it
new MutationObserver(() => document.querySelectorAll('input[type=date]:not([data-j])').forEach(i => {
  i.dataset.j = 1; const h = document.createElement('span'); h.className = 'muted'; h.style.marginInlineStart = '6px';
  const upd = () => h.textContent = i.value ? jdate(i.value) : ''; i.addEventListener('change', upd); i.after(h); upd();
})).observe(document.body, {childList: true, subtree: true});
$('#login').onclick = () => { user = $('#user').value.trim(); try { sessionStorage.setItem('almas_user', user); } catch (e) {} show(current); };
show(current);
</script>
</body>
</html>
