<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>حسابداری الماس شهر</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1f2328;--muted:#5f6670;--line:#e3e3df;--accent:#1f6f5c;--high:#b42318;--medium:#b54708;--low:#475467;--ok:#067647}
@media (prefers-color-scheme:dark){:root{--bg:#141619;--card:#1c1f23;--ink:#e8e8e6;--muted:#a3a8ae;--line:#2c3036;--accent:#4fb39a;--high:#f97066;--medium:#fdb022;--low:#98a2b3;--ok:#47cd89}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 Vazirmatn,Tahoma,system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:17px;margin:0}h2{font-size:15px;margin:4px 0 10px}main{max-width:1100px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit}
nav button[aria-selected=true],.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:600}td.num{direction:ltr;text-align:left}
.sev{font-weight:700}.sev.high{color:var(--high)}.sev.medium{color:var(--medium)}.sev.low{color:var(--low)}.zero{color:var(--ok)}
label{color:var(--muted);font-size:13px}select,input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:10px}.muted{color:var(--muted)}.err{color:var(--high)}
</style>
</head>
<body>
<header>
  <h1>حسابداری رسمی الماس شهر</h1>
  <div class="row" style="margin:0"><label>کاربر <input id="user" size="12" autocomplete="username"></label><button class="btn" id="login">ورود</button></div>
</header>
<main>
  <nav role="tablist" id="nav"></nav>
  <section id="view"><p class="muted">نام کاربری را وارد کنید.</p></section>
</main>
<script>
// This page holds NO accounting rule: every step is a catalogued operation of the core, called through the API.
const $ = s => document.querySelector(s);
const AREA = {sales: 'فروش', receivables: 'مطالبات', cheques: 'چک', inventory: 'موجودی', tax: 'مؤدیان', beta: 'اقساط بتا', ledger: 'دفتر', agents: 'نمایندگان', legacy: 'میراث هلو'};
// central staff and agent users see different tabs; an agent user is recognised by what the core lets it do (agent workspace only)
const CENTRAL_TABS = [['inbox', 'کارتابل کنترل‌ها'], ['sale', 'فاکتور فروش'], ['purchase', 'فاکتور خرید'], ['ret', 'برگشت'], ['receipt', 'دریافت وجه'],
  ['payment', 'پرداخت وجه'], ['settle', 'تطبیق حساب شخص'], ['aging', 'سن‌بندی حساب اشخاص'], ['tb', 'تراز چهارستونی'], ['mgmt', 'گزارش مدیریتی'],
  ['agents', 'نمایندگان'], ['attrib', 'انتساب فروش بانک'], ['agentpay', 'تسویه با نماینده'], ['ops', 'عملیات مجاز من']];
const AGENT_TABS = [['mydeals', 'معامله‌های من'], ['mycases', 'مشتریان و پرونده‌های من'], ['ops', 'عملیات مجاز من']];
let isAgent = false;
const METHOD = {bank_transfer: 'بانکی', cash: 'نقد', dornatel_wallet: 'کیف پول درناتل'};
const TEXT_COLS = new Set(['code', 'account_code', 'control', 'operation', 'basis', 'function_signature', 'number', 'national_id', 'buyer_national_id',
  'customer_national_id', 'bank_ref', 'ref', 'agent_code', 'proposed_agent_code', 'deal_id', 'evidence_ref', 'beta_order_id']);
const DATE_COLS = new Set(['oldest_open_due', 'since', 'effective_date', 'invoice_date', 'due_date', 'sale_date', 'registered_at', 'next_due', 'declared_at', 'created_at']);
const fmt = v => v === null || v === undefined ? '—' : (/^-?\d+(\.\d+)?$/.test(String(v)) ? Number(v).toLocaleString('fa-IR') : v);

// ---- Jalali dates: stored in the standard calendar, entered and shown in Jalali. The browser's own Persian calendar is
// the reference (no hand-written conversion): a Jalali date is found by checking candidates against Intl. ----
const FA = '۰۱۲۳۴۵۶۷۸۹';
const latin = s => String(s).replace(/[۰-۹]/g, d => FA.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const jparts = d => { const p = new Intl.DateTimeFormat('en-u-ca-persian-nu-latn', {year: 'numeric', month: 'numeric', day: 'numeric', timeZone: 'UTC'}).formatToParts(d);
                      const g = t => Number(p.find(x => x.type === t).value); return [g('year'), g('month'), g('day')]; };
const jdate = iso => { try { const [y, m, d] = jparts(new Date(iso + 'T00:00:00Z')); return latin(`${y}/${String(m).padStart(2, '0')}/${String(d).padStart(2, '0')}`).replace(/\d/g, x => FA[x]); } catch (e) { return iso; } };
function j2iso(text) {
  const m = latin(text).trim().match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/); if (!m) return null;
  const [jy, jm, jd] = m.slice(1).map(Number); if (jm < 1 || jm > 12 || jd < 1 || jd > 31) return null;
  const guess = Date.UTC(jy + 621, 2, 20) + ((jm <= 6 ? (jm - 1) * 31 : 186 + (jm - 7) * 30) + jd - 1) * 864e5;
  for (let k = -3; k <= 3; k++) { const d = new Date(guess + k * 864e5); const [y, mm, dd] = jparts(d);
    if (y === jy && mm === jm && dd === jd) return d.toISOString().slice(0, 10); }
  return null;
}
const todayIso = new Date().toISOString().slice(0, 10);
const dateInput = (id) => `<label>تاریخ <input id="${id}" class="jd" value="${jdate(todayIso)}" size="10" placeholder="۱۴۰۵/۰۱/۰۱"></label>`;
function readDate(id) { const iso = j2iso($('#' + id).value); if (!iso) throw new Error('تاریخ شمسی نامعتبر است (نمونه: ۱۴۰۵/۰۷/۰۵).'); return iso; }

let user = ''; try { user = sessionStorage.getItem('almas_user') || ''; } catch (e) {}
$('#user').value = user;
async function api(path, body) {
  const r = await fetch(path, {method: body ? 'POST' : 'GET', headers: {'X-Almas-User': user, 'Content-Type': 'application/json'},
                               body: body ? JSON.stringify(body) : undefined});
  const j = await r.json(); if (!r.ok) throw new Error(j.detail || r.status); return j;
}
const op = (name, args) => api('/operations/' + name, {args}).then(j => j.rows);
const one = rows => Object.values(rows[0])[0];
function table(rows, cols) {
  if (!rows.length) return '<p class="zero">موردی نیست.</p>';
  return '<table><thead><tr>' + cols.map(c => `<th>${c[1]}</th>`).join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + cols.map(c => { const v = r[c[0]];
      if (c[0] === 'area') return `<td>${AREA[v] || v}</td>`;
      if (c[0] === 'severity') return `<td class="sev ${v}">${{high: 'زیاد', medium: 'متوسط', low: 'کم'}[v] || v}</td>`;
      if (TEXT_COLS.has(c[0])) return `<td>${v ?? '—'}</td>`;
      if (DATE_COLS.has(c[0])) return `<td>${v ? jdate(String(v).slice(0, 10)) : '—'}</td>`;
      if (c[2] === 'html') return `<td>${v}</td>`;
      return `<td class="${/^-?\d/.test(String(v)) ? 'num' : ''}">${fmt(v)}</td>`; }).join('') + '</tr>').join('') + '</tbody></table>';
}
async function voucherHtml(source, ref) {
  const rows = await op('documents.voucher', {p_source: source, p_ref: String(ref)});
  return '<h2>سند حسابداری</h2>' + table(rows, [['account_code', 'کد'], ['account_name', 'حساب'], ['party_name', 'شخص'], ['debit', 'بدهکار'], ['credit', 'بستانکار']]);
}
const picked = {};
function lookup(inputId, listId, opName, key, label, extra = {}) {
  const inp = $('#' + inputId);
  inp.oninput = async () => {
    const q = inp.value.trim(); picked[inputId] = null; if (q.length < 2) return;
    const rows = await op(opName, {p_query: q, ...extra});
    $('#' + listId).innerHTML = rows.map(r => `<option value="${r[label]}">`).join('');
    const hit = rows.find(r => String(r[label]) === q); picked[inputId] = hit ? hit[key] : null;
    picked[inputId + '_row'] = hit || null;
  };
}
const options = (rows, key, label) => rows.map(r => `<option value="${r[key]}">${r[label]}</option>`).join('');

// ---- views ----
const views = {
  async inbox() {
    const k = window._keep || {}, asOf = k.inboxd ? j2iso(k.inboxd) : todayIso;
    const head = `<div class="card row"><label>تا تاریخ <input id="inboxd" value="${k.inboxd || jdate(todayIso)}" size="10"></label>
      <button class="btn" onclick="show('inbox')">به‌روزرسانی</button></div>`;
    if (!asOf) return head + '<p class="err">تاریخ نامعتبر است.</p>';
    const rows = await op('controls.inbox', {p_as_of: asOf});
    const open = rows.filter(r => Number(r.items) > 0), clear = rows.length - open.length, order = ['high', 'medium', 'low'];
    return head + `<div class="card"><p>${fmt(open.length)} کنترل نیازمند توجه · <span class="zero">${fmt(clear)} کنترل بدون مورد</span></p>` +
      table(open.sort((a, b) => order.indexOf(a.severity) - order.indexOf(b.severity)),
            [['area', 'حوزه'], ['control', 'کد'], ['severity', 'شدت'], ['title', 'شرح'], ['items', 'تعداد'], ['amount', 'مبلغ (ریال)'], ['basis', 'پشتوانه']]) + '</div>';
  },
  sale: () => invoiceForm('sales'),
  purchase: () => invoiceForm('purchase'),
  receipt: () => moneyForm('receive'),
  payment: () => moneyForm('pay'),
  async ret() {
    setTimeout(wireReturn, 0);
    return `<div class="card"><div class="row">
      <label>نوع <select id="rkind"><option value="sales">برگشت از فروش</option><option value="purchase">برگشت از خرید</option></select></label>
      <label>فاکتور (شماره یا نام شخص) <input id="rinv" size="24"></label><button class="btn" id="rfind">جست‌وجو</button></div>
      <div id="rlist"></div><div id="rlines"></div><div id="rmsg"></div></div>`;
  },
  async settle() {
    setTimeout(wireSettle, 0);
    return `<div class="card"><div class="row"><label>شخص <input id="tparty" list="tplist" size="28"></label><datalist id="tplist"></datalist>
      <button class="btn" id="tshow">نمایش</button></div><div id="tsub"></div><div id="tmsg"></div>
      <p class="muted">تطبیق، دریافت‌ها و بستانکاری‌های باز را به ترتیب قدیمی‌ترین بدهی تخصیص می‌دهد. هر تخصیص با علت قابل برگشت است.</p></div>`;
  },
  async aging() {
    const rows = (await op('ar.aging_report', {p_as_of: todayIso})).slice(0, 300);
    return '<div class="card">' + table(rows, [['party_name', 'شخص'], ['account_code', 'حساب'], ['not_due', 'سررسیدنشده'], ['overdue_1_90', '۱ تا ۹۰ روز گذشته'],
      ['overdue_over_90', 'بیش از ۹۰ روز'], ['unapplied_credit', 'بستانکار تخصیص‌نیافته'], ['net', 'خالص'], ['oldest_open_due', 'قدیمی‌ترین سررسید']]) + '</div>';
  },
  async tb() {
    const k = window._keep || {}, y = k.tby || '', f = k.tbf || '', t = k.tbt || '';
    let out = `<div class="card row"><label>سال مالی <input id="tby" value="${y}" size="5" placeholder="۱۴۰۵"></label>
      <label>از <input id="tbf" value="${f}" size="10" placeholder="۱۴۰۵/۰۱/۰۱"></label><label>تا <input id="tbt" value="${t}" size="10" placeholder="۱۴۰۵/۱۲/۲۹"></label>
      <button class="btn" onclick="show('tb')">نمایش</button></div>`;
    if (!y || !f || !t) return out + '<p class="muted">سال و بازه را به تاریخ شمسی وارد کنید.</p>';
    const from = j2iso(f), to = j2iso(t); if (!from || !to) return out + '<p class="err">تاریخ نامعتبر است.</p>';
    const rows = (await op('ledger.trial_balance', {p_year: latin(y), p_from: from, p_to: to})).filter(r => r.party_id === null && r.level <= 2)
      .sort((a, b) => a.code.localeCompare(b.code));
    return out + '<div class="card">' + table(rows, [['code', 'کد'], ['name', 'حساب'], ['opening', 'مانده اول'], ['period_debit', 'گردش بدهکار'],
      ['period_credit', 'گردش بستانکار'], ['closing_debit', 'مانده بدهکار'], ['closing_credit', 'مانده بستانکار']]) + '</div>';
  },
  async mgmt() {
    const y = (window._keep || {}).my || '';
    let out = `<div class="card row"><label>سال مالی <input id="my" value="${y}" size="5" placeholder="۱۴۰۵"></label>
      <button class="btn" onclick="show('mgmt')">نمایش</button></div>`;
    if (!y) return out + '<p class="muted">سال مالی را وارد کنید.</p>';
    const [m, inv] = await Promise.all([op('reports.monthly_margin', {p_year: latin(y)}), op('reports.inventory_status', {p_as_of: todayIso})]);
    const tot = k => m.reduce((a, r) => a + Number(r[k]), 0);
    const sum = {period: 'جمع', net_sales: tot('net_sales'), cost_of_sales_kardex: tot('cost_of_sales_kardex'), gross_margin: tot('gross_margin'),
                 gross_sales: tot('gross_sales'), returns_and_discounts: tot('returns_and_discounts'),
                 margin_percent: tot('net_sales') ? (100 * tot('gross_margin') / tot('net_sales')).toFixed(1) : null};
    return out + '<div class="card"><h2>فروش و سود ناخالص ماهانه</h2>' + table([...m, sum], [['period', 'دوره'], ['gross_sales', 'فروش'],
        ['returns_and_discounts', 'برگشت و تخفیف'], ['net_sales', 'فروش خالص'], ['cost_of_sales_kardex', 'بهای فروش (کاردکس)'], ['gross_margin', 'سود ناخالص'],
        ['margin_percent', 'درصد']]) +
      '<p class="muted">بهای فروش ماهانه از کاردکس برآورد می‌شود (موجودی ادواری، D-02). بهای قطعی سال همان سند بستن سال است.</p></div>' +
      '<div class="card"><h2>موجودی کالا (بیشترین ارزش)</h2>' + table(inv.slice(0, 50), [['item_name', 'کالا'], ['warehouse_name', 'انبار'], ['qty', 'مقدار'],
        ['avg_cost', 'میانگین بها'], ['value', 'ارزش'], ['days_since_last_sale', 'روز از آخرین فروش']]) + '</div>';
  },
  // ---- central: agents (their sales with the real buyer, pending base amounts) ----
  async agents() {
    const [ov, pend, list] = await Promise.all([op('agents.overview', {}), op('agents.deals_pending', {}), op('agents.list', {})]);
    const sel = (window._keep || {}).agsel || '';
    window._after = () => { $('#agsel').value = sel; $('#agsel').onchange = () => show('agents'); };
    let out = '<div class="card"><h2>نمایندگان — سه نقش جدا</h2>' + table(ov, [['code', 'کد'], ['title', 'نماینده'], ['sales_as_agent', 'فروش به‌عنوان نماینده'],
        ['buyers_beta_total', 'مبلغ کل بتای خریداران'], ['owed_to_agent', 'طلب نماینده'], ['open_to_agent', 'مانده تسویه‌نشده'],
        ['own_contracts_as_customer', 'خرید شخصی (نقش مشتری)'], ['legacy_aggregate_balance', 'میراث تجمیعی هلو'], ['legacy_unclassified', 'میراث بی‌خریدار']]) +
      '<p class="muted">فروش‌های نماینده متعلق به خریداران واقعی است و بدهی شخصی او نیست. خرید شخصی او جدا شمرده می‌شود.</p></div>';
    out += `<div class="card"><div class="row"><label>گزارش نماینده <select id="agsel"><option value="">—</option>${options(list, 'agent_id', 'title')}</select></label></div>`;
    if (sel) out += table((await op('agents.report', {p_agent: Number(sel)})).map(r => ({...r, methods: (r.settlement_methods || []).map(m => METHOD[m] || m).join('، ') || '—'})), [['bank_ref', 'شناسه بانک'], ['registered_at', 'تاریخ ثبت'], ['buyer_name', 'خریدار واقعی'],
        ['buyer_national_id', 'کد ملی خریدار'], ['beta_total', 'مبلغ کل بتا'], ['base_amount', 'مبلغ پایه'], ['owed_to_agent', 'طلب'], ['settled', 'تسویه‌شده'],
        ['open_to_agent', 'مانده'], ['methods', 'روش تسویه'], ['state_fa', 'وضعیت']]);
    out += '</div><div class="card"><h2>معامله‌های در انتظار تأیید مبلغ پایه</h2>' +
      table(pend.map(r => ({...r, bank: r.bank_ref ? `${r.bank_ref}${r.customer_matches === false ? ' ⚠ خریدار متفاوت' : ''}` : 'در بانک دیده نشده',
          act: `<button class="btn primary" onclick="window._approve(${r.deal_id})">تأیید</button> <button class="btn" onclick="window._reject(${r.deal_id})">رد</button>`})),
        [['deal_id', 'معامله'], ['agent_code', 'نماینده'], ['sale_date', 'تاریخ فروش'], ['customer_national_id', 'کد ملی خریدار'], ['goods_description', 'کالا'],
         ['base_amount', 'مبلغ پایه (ریال)'], ['evidence_ref', 'مدرک'], ['bank', 'فروش بانکی'], ['beta_total', 'مبلغ کل بتا'], ['act', '', 'html']]) +
      '<p class="muted">تأیید، دقیقاً «مبلغ پایه» را طلب نماینده می‌کند، نه مبلغ کل بتا. تفاوت این دو سود حساب نمی‌شود (D-26).</p><div id="agmsg"></div></div>';
    window._approve = async id => { try { await op('agent.deal_approve', {p_deal: id}); show('agents'); } catch (e) { $('#agmsg').innerHTML = `<p class="err">${e.message}</p>`; } };
    window._reject = async id => { const r = prompt('علت رد:'); if (!r) return;
      try { await op('agent.deal_close', {p_deal: id, p_status: 'rejected', p_reason: r}); show('agents'); } catch (e) { $('#agmsg').innerHTML = `<p class="err">${e.message}</p>`; } };
    return out;
  },
  // ---- central: attribution of bank sales to agents — proposals with reasons; a person decides ----
  async attrib() {
    const [q, list] = await Promise.all([op('agents.attribution_queue', {p_limit: 200}), op('agents.list', {})]);
    const STATE = {proposed: 'پیشنهاد قوی', conflict: 'متعارض', weak: 'ضعیف', no_candidate: 'بدون نشانه'};
    window._qrows = q;
    const rows = q.map((r, i) => ({...r, st: STATE[r.state] || r.state,
      act: r.state === 'proposed'
        ? `<button class="btn primary" onclick="window._confirm(${i})">تأیید پیشنهاد</button>`
        : `<select id="qa${i}"><option value="">نماینده…</option>${options(list, 'agent_id', 'code')}</select> <button class="btn" onclick="window._manual(${i})">انتساب با علت</button>`}));
    window._confirm = async i => { const r = window._qrows[i];
      try { await op('agent.attribute', {p_scheme: r.scheme_id, p_source: r.source, p_ref: r.ref, p_agent: r.proposed_agent_id, p_deal: r.proposed_deal_id, p_method: 'auto'});
            show('attrib'); } catch (e) { $('#qmsg').innerHTML = `<p class="err">${e.message}</p>`; } };
    window._manual = async i => { const r = window._qrows[i], a = $('#qa' + i).value; if (!a) return;
      const why = prompt('علت انتساب دستی (مدرک):'); if (!why) return;
      try { await op('agent.attribute', {p_scheme: r.scheme_id, p_source: r.source, p_ref: r.ref, p_agent: Number(a), p_deal: null, p_method: 'manual', p_reason: why});
            show('attrib'); } catch (e) { $('#qmsg').innerHTML = `<p class="err">${e.message}</p>`; } };
    return '<div class="card"><h2>فروش‌های بانک در انتظار انتساب به نماینده</h2>' + table(rows, [['ref', 'شناسه بانک'], ['registered_at', 'تاریخ ثبت'],
        ['national_id', 'کد ملی خریدار'], ['total_amount', 'مبلغ کل'], ['st', 'وضعیت'], ['proposed_agent_code', 'نماینده پیشنهادی'], ['reasons', 'دلیل'], ['act', '', 'html']]) +
      '<p class="muted">هیچ فروشی حدسی منتسب نمی‌شود: پیشنهاد فقط از شناسه اعلام‌شده نماینده، ثبت‌کننده پنل طبق نگاشت الماس، یا خریدار و تاریخ ساخته می‌شود؛ بقیه با علت و Audit.</p><div id="qmsg"></div></div>';
  },
  // ---- central: pay an agent by bank transfer or Dornatel wallet, allocated to its deals ----
  async agentpay() {
    const [list, banks] = await Promise.all([op('agents.list', {}), op('bank_accounts.list', {})]);
    const sel = (window._keep || {}).psel || '';
    window._after = () => { $('#psel').value = sel; $('#psel').onchange = () => show('agentpay'); wirePay(); };
    let out = `<div class="card"><div class="row"><label>نماینده <select id="psel"><option value="">—</option>${options(list, 'agent_id', 'title')}</select></label></div>`;
    if (!sel) return out + '</div>';
    const ents = await op('agents.open_entitlements', {p_agent: Number(sel)});
    window._ents = ents;
    out += table(ents.map((r, i) => ({...r, pay: `<input type="number" min="0" max="${r.open_amount}" value="${r.open_amount}" data-ent="${r.entitlement_id}" style="width:130px">`})),
      [['deal_id', 'معامله'], ['customer_national_id', 'کد ملی خریدار'], ['amount', 'طلب'], ['settled', 'تسویه‌شده'], ['open_amount', 'مانده'], ['pay', 'پرداخت این بار', 'html']]);
    return out + `<div class="row">${dateInput('pdate')}<label>روش <select id="pmethod"><option value="bank_transfer">انتقال بانکی</option><option value="dornatel_wallet">شارژ کیف پول درناتل</option></select></label>
      <label>از حساب بانکی الماس <select id="pbank">${options(banks, 'bank_account_id', 'title')}</select></label>
      <label>مرجع پرداخت / شناسه تراکنش درناتل <input id="pref" size="16"></label><label>حساب کیف پول <input id="pwallet" size="10"></label>
      <button class="btn primary" id="psave">ثبت تسویه</button></div><div id="pmsg"></div></div>`;
  },
  // ---- agent workspace ----
  async mydeals() {
    const rows = await op('agent.my_deals', {});
    window._after = wireDeal;
    return `<div class="card"><h2>اعلام فروش انجام‌شده در پنل بانک</h2><div class="row">${dateInput('ddate')}
        <label>کد ملی خریدار <input id="dnc" size="12"></label><label>نام خریدار <input id="dname" size="18"></label>
        <label>کالا <input id="dgoods" size="18"></label><label>مبلغ پایه کالا (ریال) <input id="dbase" type="number" min="1" style="width:150px"></label>
        <label>شماره فاکتور/مدرک <input id="devid" size="12"></label></div>
      <div class="row"><label>مبلغ کل قرارداد در پنل (اختیاری) <input id="dtotal" type="number" min="1" style="width:150px"></label>
        <label>شناسه فروش در پنل (اختیاری) <input id="dref" size="12"></label><button class="btn primary" id="dsave">ثبت اعلام</button></div><div id="dmsg"></div>
      <p class="muted">مبلغ پایه پس از تأیید الماس طلب شما می‌شود و معمولاً ظرف ۲۴ ساعت تسویه می‌شود.</p></div>
      <div class="card"><h2>معامله‌های من</h2>` + table(rows.map(r => ({...r, bank: r.matched_with_bank ? 'بله' : 'هنوز نه'})), [['deal_id', 'معامله'], ['sale_date', 'تاریخ'],
        ['customer_name', 'خریدار'], ['goods', 'کالا'], ['base_amount', 'مبلغ پایه'], ['status_fa', 'وضعیت'], ['bank', 'دیده شده در بانک'], ['owed', 'طلب'],
        ['paid_by_bank', 'پرداخت بانکی'], ['paid_by_wallet', 'کیف پول درناتل'], ['open_amount', 'مانده']]) + '</div>';
  },
  async mycases() {
    const [cases, cust] = await Promise.all([op('agent.my_cases', {}), op('agent.my_customers', {})]);
    return '<div class="card"><h2>پرونده‌های من</h2>' + table(cases, [['beta_order_id', 'شناسه بانک'], ['customer_name', 'خریدار'], ['total_amount', 'مبلغ کل'],
        ['installments', 'اقساط'], ['paid_count', 'پرداخت‌شده'], ['overdue_count', 'معوق'], ['outstanding', 'مانده مشتری'], ['next_due', 'سررسید بعدی'], ['next_amount', 'مبلغ قسط بعدی']]) +
      '</div><div class="card"><h2>مشتریان من</h2>' + table(cust, [['name', 'نام'], ['national_id', 'کد ملی'], ['contracts', 'قرارداد'], ['outstanding', 'مانده'], ['overdue_count', 'قسط معوق']]) + '</div>';
  },
  async ops() {
    const rows = await api('/operations');
    return '<div class="card">' + table(rows.map(r => ({...r, permitted: r.permitted ? 'بله' : 'خیر', kind: r.kind === 'write' ? 'ثبت' : 'مشاهده'})),
      [['operation', 'عملیات'], ['kind', 'نوع'], ['purpose', 'هدف'], ['permitted', 'مجاز'], ['undo', 'راه برگشت'], ['basis', 'پشتوانه']]) + '</div>';
  }
};

// ---- one invoice form for sales and purchases ----
async function invoiceForm(kind) {
  const [wh, cash] = await Promise.all([op('warehouses.list', {}), op('money_accounts.list', {})]);
  const sale = kind === 'sales';
  setTimeout(() => wireInvoice(kind), 0);
  return `<div class="card"><div class="row">${dateInput('idate')}
      <label>${sale ? 'مشتری' : 'تأمین‌کننده'} <input id="iparty" list="iplist" placeholder="نام، کد ملی یا موبایل" size="28"></label><datalist id="iplist"></datalist>
      ${sale ? '' : '<label>شماره فاکتور فروشنده <input id="isupno" size="12"></label><label>هزینه‌های فاکتور (حمل و …) <input id="iextra" type="number" min="0" value="0" style="width:130px"></label>'}</div>
    <div class="row"><label>کالا <input id="iitem" list="iilist" size="24"></label><datalist id="iilist"></datalist>
      <label>انبار <select id="iwh">${options(wh, 'warehouse_id', 'name')}</select></label>
      <label>تعداد <input id="iqty" type="number" min="1" value="1" style="width:80px"></label>
      <label>قیمت واحد (ریال) <input id="iprice" type="number" min="0" style="width:140px"></label>
      <label>تخفیف ردیف <input id="idisc" type="number" min="0" value="0" style="width:110px"></label>
      <button class="btn" id="iadd">افزودن ردیف</button></div>
    <div id="ilines"></div>
    <div class="row"><label>${sale ? 'دریافت همان لحظه' : 'پرداخت همان لحظه'} (ریال) <input id="ipaid" type="number" min="0" value="0" style="width:140px"></label>
      <label>${sale ? 'به' : 'از'} <select id="icash">${options(cash, 'account_id', 'name')}</select></label>
      <button class="btn primary" id="isave">ثبت نهایی فاکتور</button></div>
    <div id="imsg"></div></div>`;
}
function wireInvoice(kind) {
  const lines = [], sale = kind === 'sales';
  lookup('iparty', 'iplist', 'parties.find', 'party_id', 'name'); lookup('iitem', 'iilist', 'items.find', 'item_id', 'name');
  const draw = () => $('#ilines').innerHTML = lines.length ? table(lines.map((l, i) => ({...l, n: i + 1, total: l.quantity * l.unit_price - l.discount,
      del: `<button class="btn" onclick="this.closest('tr').dataset.x=1;window._del(${i})">حذف</button>`})),
      [['n', 'ردیف'], ['name', 'کالا'], ['wh', 'انبار'], ['quantity', 'تعداد'], ['unit_price', 'قیمت واحد'], ['discount', 'تخفیف'], ['total', 'جمع'], ['del', '', 'html']]) : '';
  window._del = i => { lines.splice(i, 1); draw(); };
  $('#iadd').onclick = () => {
    if (!picked.iitem) return $('#imsg').innerHTML = '<p class="err">کالا را از فهرست انتخاب کنید.</p>';
    lines.push({item_id: picked.iitem, name: $('#iitem').value, warehouse_id: Number($('#iwh').value), wh: $('#iwh').selectedOptions[0].text,
                quantity: Number($('#iqty').value), unit_price: Number($('#iprice').value), discount: Number($('#idisc').value)});
    $('#imsg').innerHTML = ''; draw();
  };
  $('#isave').onclick = async () => {
    const msg = $('#imsg');
    try {
      if (!picked.iparty || !lines.length) throw new Error((sale ? 'مشتری' : 'تأمین‌کننده') + ' و دست‌کم یک ردیف لازم است.');
      const date = readDate('idate'), paid = Number($('#ipaid').value);
      const pay = paid > 0 ? [{method: 'cash', account_id: Number($('#icash').value), amount: paid}] : [];
      const body = lines.map(({item_id, warehouse_id, quantity, unit_price, discount}) => ({item_id, warehouse_id, quantity, unit_price, discount}));
      let id;
      if (sale) {
        id = one(await op('sales.create', {p_date: date, p_party: picked.iparty, p_lines: body, p_payments: pay}));
        try { await op('sales.finalize', {p_invoice: id}); }
        catch (e) {
          if (!/below/.test(e.message)) throw e;
          const reason = prompt('فروش زیر قیمت خرید است. در صورت تأیید، علت را بنویسید:');
          if (!reason) throw new Error('فاکتور به‌صورت پیش‌نویس ماند (فروش زیر قیمت خرید تأیید نشد).');
          await op('sales.finalize', {p_invoice: id, p_acknowledge_below_cost: true, p_below_cost_reason: reason});
        }
      } else {
        id = one(await op('purchase.create', {p_date: date, p_party: picked.iparty, p_lines: body, p_payments: pay,
                                              p_supplier_invoice_no: $('#isupno').value || null, p_extra_cost: Number($('#iextra').value)}));
        await op('purchase.finalize', {p_invoice: id});
      }
      msg.innerHTML = `<p class="zero">فاکتور ثبت نهایی شد (سند حسابداری و ${sale ? 'خروج' : 'ورود'} کالا).</p>` +
                      await voucherHtml(sale ? 'sales_invoice' : 'purchase_invoice', id);
      lines.length = 0; draw();
    } catch (e) { msg.innerHTML = `<p class="err">${e.message}</p>`; }
  };
}

// ---- one money form for receipts and payments ----
async function moneyForm(kind) {
  const cash = await op('money_accounts.list', {});
  setTimeout(() => {
    lookup('mparty', 'mplist', 'parties.find', 'party_id', 'name');
    $('#msave').onclick = async () => {
      const msg = $('#mmsg');
      try {
        if (!picked.mparty) throw new Error('شخص را از فهرست انتخاب کنید.');
        const entry = one(await op(kind === 'receive' ? 'treasury.receive' : 'treasury.pay', {p_party: picked.mparty, p_money_account: Number($('#mcash').value),
                                   p_amount: Number($('#mamount').value), p_date: readDate('mdate'), p_description: $('#mdesc').value || null}));
        msg.innerHTML = `<p class="zero">${kind === 'receive' ? 'دریافت' : 'پرداخت'} ثبت شد (سند ${fmt(entry)}).</p>`;
      } catch (e) { msg.innerHTML = `<p class="err">${e.message}</p>`; }
    };
  }, 0);
  return `<div class="card"><div class="row">${dateInput('mdate')}
      <label>${kind === 'receive' ? 'از' : 'به'} شخص <input id="mparty" list="mplist" size="28"></label><datalist id="mplist"></datalist>
      <label>مبلغ (ریال) <input id="mamount" type="number" min="1" style="width:160px"></label>
      <label>${kind === 'receive' ? 'به' : 'از'} <select id="mcash">${options(cash, 'account_id', 'name')}</select></label>
      <label>شرح <input id="mdesc" size="24"></label>
      <button class="btn primary" id="msave">ثبت</button></div><div id="mmsg"></div></div>`;
}

// ---- returns ----
function wireReturn() {
  $('#rfind').onclick = async () => {
    const kind = $('#rkind').value;
    const rows = await op('invoices.find', {p_kind: kind, p_query: latin($('#rinv').value.trim())});
    $('#rlist').innerHTML = table(rows.map(r => ({...r, pick: `<button class="btn" onclick="window._pick('${kind}', ${r.invoice_id})">انتخاب</button>`})),
      [['number', 'شماره'], ['invoice_date', 'تاریخ'], ['party_name', 'شخص'], ['total', 'مبلغ'], ['pick', '', 'html']]);
  };
  window._pick = async (kind, invoice) => {
    const rows = await op('invoices.returnable', {p_kind: kind, p_invoice: invoice});
    $('#rlines').innerHTML = `<h2>ردیف‌های قابل برگشت</h2>` + table(rows.map(r => ({...r,
        q: `<input type="number" min="0" max="${r.returnable}" value="0" data-line="${r.line_no}" style="width:80px">`})),
      [['line_no', 'ردیف'], ['item_name', 'کالا'], ['quantity', 'تعداد فاکتور'], ['returnable', 'قابل برگشت'], ['net_unit_price', 'قیمت واحد'], ['q', 'تعداد برگشتی', 'html']]) +
      `<div class="row">${dateInput('rdate')}<label>علت <input id="rreason" size="30"></label><button class="btn primary" id="rsave">ثبت نهایی برگشت</button></div>`;
    $('#rsave').onclick = async () => {
      const msg = $('#rmsg');
      try {
        const lines = [...document.querySelectorAll('#rlines input[data-line]')].map(i => ({original_line_no: Number(i.dataset.line), quantity: Number(i.value)}))
                      .filter(l => l.quantity > 0);
        if (!lines.length) throw new Error('دست‌کم یک ردیف با تعداد برگشتی لازم است.');
        const id = one(await op('return.create', {p_kind: kind === 'sales' ? 'sales_return' : 'purchase_return', p_invoice: invoice,
                                                  p_date: readDate('rdate'), p_reason: $('#rreason').value, p_lines: lines}));
        await op('return.finalize', {p_return: id});
        msg.innerHTML = '<p class="zero">برگشت ثبت نهایی شد.</p>' + await voucherHtml('return', id);
        window._pick(kind, invoice);
      } catch (e) { msg.innerHTML = `<p class="err">${e.message}</p>`; }
    };
  };
}

// ---- settlement (matching receipts to invoices) ----
function wireSettle() {
  lookup('tparty', 'tplist', 'parties.find', 'party_id', 'name');
  const showSub = async () => {
    if (!picked.tparty) return $('#tmsg').innerHTML = '<p class="err">شخص را از فهرست انتخاب کنید.</p>';
    const rows = await op('ar.party_subledgers', {p_party: picked.tparty});
    $('#tsub').innerHTML = table(rows.map(r => ({...r, act: (Number(r.open_debit) > 0 && Number(r.open_credit) > 0)
        ? `<button class="btn" onclick="window._fifo(${r.account_id})">تطبیق خودکار</button>` : '—'})),
      [['account_code', 'حساب'], ['account_name', 'نام حساب'], ['balance', 'مانده'], ['open_debit', 'بدهی باز'], ['open_credit', 'بستانکار باز'], ['act', '', 'html']]);
  };
  $('#tshow').onclick = showSub;
  window._fifo = async account => {
    try { const n = one(await op('ar.allocate_fifo', {p_account: account, p_party: picked.tparty}));
          $('#tmsg').innerHTML = `<p class="zero">${fmt(n)} تخصیص ثبت شد.</p>`; showSub(); }
    catch (e) { $('#tmsg').innerHTML = `<p class="err">${e.message}</p>`; }
  };
}

function wireDeal() {
  $('#dsave').onclick = async () => {
    const msg = $('#dmsg');
    try {
      const total = Number($('#dtotal').value) || null;
      const id = one(await op('agent.deal_declare', {p_national_id: latin($('#dnc').value), p_customer_name: $('#dname').value, p_sale_date: readDate('ddate'),
        p_goods: $('#dgoods').value, p_base_amount: Number($('#dbase').value), p_base_source: 'agent_invoice', p_evidence_ref: $('#devid').value,
        p_declared_beta_total: total, p_declared_order_ref: latin($('#dref').value) || null}));
      msg.innerHTML = `<p class="zero">معامله ${fmt(id)} ثبت شد و در انتظار تأیید الماس است.</p>`;
      setTimeout(() => show('mydeals'), 900);
    } catch (e) { msg.innerHTML = `<p class="err">${e.message}</p>`; }
  };
}
function wirePay() {
  if (!$('#psave')) return;
  $('#psave').onclick = async () => {
    const msg = $('#pmsg');
    try {
      const alloc = [...document.querySelectorAll('input[data-ent]')].map(i => ({entitlement_id: Number(i.dataset.ent), amount: Number(i.value)})).filter(a => a.amount > 0);
      const amount = alloc.reduce((a, x) => a + x.amount, 0), method = $('#pmethod').value, ref = $('#pref').value.trim();
      if (!amount) throw new Error('مبلغی برای پرداخت انتخاب نشده است.');
      if (!ref) throw new Error(method === 'dornatel_wallet' ? 'شناسه تراکنش درناتل لازم است.' : 'مرجع پرداخت بانکی لازم است.');
      const args = {p_agent: Number($('#psel').value), p_method: method, p_amount: amount, p_paid_at: readDate('pdate'), p_allocations: alloc};
      if (method === 'bank_transfer') Object.assign(args, {p_bank_account: Number($('#pbank').value), p_bank_ref: ref});
      else Object.assign(args, {p_dornatel_txn_ref: ref, p_wallet_account_ref: $('#pwallet').value.trim()});
      await op('agent.settle', args);
      msg.innerHTML = `<p class="zero">تسویه ${fmt(amount)} ریال ثبت شد.</p>`; setTimeout(() => show('agentpay'), 900);
    } catch (e) { msg.innerHTML = `<p class="err">${e.message}</p>`; }
  };
}

let current = 'inbox';
async function show(tab) {
  current = tab;
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  window._keepSel = {}; document.querySelectorAll('#view select').forEach(i => { if (i.id) window._keepSel[i.id] = i.value; });
  if (!user) { $('#view').innerHTML = '<p class="muted">نام کاربری را وارد کنید.</p>'; return; }
  // keep what the user typed before the view is redrawn (report parameters)
  window._keep = {...window._keepSel}; document.querySelectorAll('#view input').forEach(i => { if (i.id) window._keep[i.id] = i.value; });
  $('#view').innerHTML = '<p class="muted">در حال بارگذاری…</p>';
  window._after = null;
  try { $('#view').innerHTML = await views[tab](); if (window._after) window._after(); }   // wire a view only after its HTML is in place
  catch (e) { $('#view').innerHTML = `<p class="err">${e.message}</p>`; }
}
function drawNav() {
  const tabs = isAgent ? AGENT_TABS : CENTRAL_TABS;
  if (!tabs.some(t => t[0] === current)) current = tabs[0][0];
  $('#nav').innerHTML = tabs.map(([k, v]) => `<button role="tab" data-tab="${k}" aria-selected="${k === current}">${v}</button>`).join('');
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.tab));
}
async function start() {
  isAgent = false;
  if (user) { try { isAgent = !(await api('/operations')).some(o => o.operation === 'controls.inbox'); } catch (e) {} }
  drawNav(); show(current);
}
$('#login').onclick = () => { user = $('#user').value.trim(); try { sessionStorage.setItem('almas_user', user); } catch (e) {} start(); };
start();
</script>
